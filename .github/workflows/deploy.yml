name: Deploy Hybrid Cloud Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend_api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/judge-backend:latest
          provenance: false

      - name: Build and Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./judge_worker
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/judge-worker:latest
          provenance: false

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/judge-app
            git pull origin main
            
            # Ensure Docker Compose v2 is installed globally to prevent ContainerConfig errors
            if ! docker compose version > /dev/null 2>&1; then
              echo "Docker Compose v2 not found. Installing globally..."
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi
            
            # Force remove old containers to clear corrupted states
            docker compose -f docker-compose.prod.yml down || true
            docker rm -f judge_backend judge_worker || true
            
            # Deploy using bulletproof v2
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
